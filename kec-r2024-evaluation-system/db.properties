# ============================================================================
# KEC R2024 Evaluation System Database Configuration
# ============================================================================
# Database mode options: 'h2' or 'mysql'
# - 'h2': Embedded zero-config file database (runs out of the box with zero setup)
# - 'mysql': Connects to local or remote MySQL Server (e.g. XAMPP / MySQL 8.x)
db.type=h2

# H2 Configuration (Embedded file-based)
h2.driver=org.h2.Driver
h2.url=jdbc:h2:./kec_eval_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
h2.user=sa
h2.password=

# MySQL Configuration (uncomment or set db.type=mysql when MySQL Server is running)
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://localhost:3306/kec_eval_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
mysql.user=root
mysql.password=root

